[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recipebook"
version = "0.1.0"
description = "Personal recipe bank with LLM-assisted revision behind a review gate"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
recipebook = "recipebook.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recipebook"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    # Ambiguous-unicode rules. Recipe content is Russian, so Cyrillic in strings
    # and comments is the subject matter, not a homoglyph attack. Left on, these
    # fire on essentially every fixture and example in the project.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

# domain/ and llm/ are pure logic and schemas — hold them to the strict bar.
[[tool.mypy.overrides]]
module = "recipebook.domain.*"
strict = true

[[tool.mypy.overrides]]
module = "recipebook.llm.*"
strict = true

# web/ is framework glue; decorators and request objects fight strict mode.
[[tool.mypy.overrides]]
module = "recipebook.web.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." so tests/ is importable as a package and fixtures can be shared between
# modules without a conftest that re-exports everything.
pythonpath = ["src", "."]
